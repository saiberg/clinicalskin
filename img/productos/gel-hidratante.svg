  <rect x="158" y="242" width="84" height="112" rx="14" fill="#FFFFFF"/>
  <text x="200" y="292" font-family="Georgia, serif" font-size="26" letter-spacing="3" fill="#7C4E3F" text-anchor="middle">GEL</text>
  <rect x="176" y="305" width="48" height="2" rx="1" fill="#C46E82"/>
  <text x="200" y="330" font-family="Georgia, serif" font-size="12" letter-spacing="1" fill="#C46E82" text-anchor="middle">OIL-FREE</text>
</svg>
