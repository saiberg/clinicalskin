      <stop offset="0" stop-color="#FDF4EF"/>
      <stop offset="1" stop-color="#F6E2DA"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <circle cx="200" cy="245" r="150" fill="#FBE7EB" opacity="0.55"/>
  <ellipse cx="200" cy="430" rx="82" ry="12" fill="#7C4E3F" opacity="0.10"/>
  <!-- dosificador airless -->
  <rect x="196" y="112" width="48" height="15" rx="7" fill="#7C4E3F"/>
  <rect x="178" y="126" width="44" height="34" rx="8" fill="#9E6450"/>
  <!-- cuerpo -->
  <rect x="146" y="158" width="108" height="252" rx="22" fill="#F1C4CD"/>
  <rect x="162" y="178" width="13" height="95" rx="6" fill="#FFFFFF" opacity="0.45"/>
